# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=spring-security
spring.profiles.active=demo

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=9091
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# DATABASE CONFIGURATION (CAMBIADO A H2)
# ==========================================
# La base de datos se crea en memoria al arrancar y se borra al cerrar
spring.datasource.url=jdbc:h2:mem:clima_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola de H2 en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Usamos 'create-drop' para que limpie todo al iniciar en modo demo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logging de SQL
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.com.dwes=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n